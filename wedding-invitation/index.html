<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Invitation</title>
<meta name="description" content="You are invited to our wedding.">
<meta property="og:title" content="You're invited to our wedding">
<meta property="og:description" content="Join us in celebrating our wedding.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="locked">

<!-- Gate: tap to open the doors -->
<div class="gate" id="gate">
  <div class="door left"></div><div class="door right"></div>
  <button class="open-btn" id="openBtn" aria-label="Open invitation">
    <span class="monogram" id="monogram">A &amp; K</span>
    <span class="hint">Tap to open</span>
  </button>
</div>

<main>
  <section class="hero">
    <div class="arch">
      <div class="hero-photo" id="heroPhoto" hidden></div>
      <p class="lead" id="tagline"></p>
      <h1><span id="bride"></span><span class="amp">&amp;</span><span id="groom"></span></h1>
      <p class="date" id="dateLabel"></p>
      <p class="venue" id="venueShort"></p>
    </div>
  </section>

  <section class="block" id="countdownWrap">
    <h2>Counting down to the wedding</h2>
    <div class="countdown" id="countdown" aria-live="off">
      <div><b id="cd-d">0</b><small>days</small></div>
      <div><b id="cd-h">0</b><small>hours</small></div>
      <div><b id="cd-m">0</b><small>minutes</small></div>
      <div><b id="cd-s">0</b><small>seconds</small></div>
    </div>
    <button class="btn ghost" id="calBtn">Add to calendar</button>
  </section>

  <section class="block alt">
    <h2>Our story</h2>
    <div class="story" id="story"></div>
  </section>

  <section class="block">
    <h2>The celebrations</h2>
    <ol class="timeline" id="timeline"></ol>
  </section>

  <section class="block dark">
    <h2>Moments together</h2>
    <div class="gallery" id="gallery"></div>
  </section>

  <section class="block">
    <h2>Venue</h2>
    <p id="venueFull" class="center-text"></p>
    <div class="map"><iframe id="mapFrame" title="Venue map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
    <a class="btn" id="mapBtn" target="_blank" rel="noopener">Get directions</a>
    <p class="note" id="dress"></p>
  </section>

  <section class="block alt">
    <h2>Will you join us?</h2>
    <p class="center-text" id="rsvpNote"></p>
    <form id="rsvpForm" class="rsvp">
      <label>Your name<input name="name" required autocomplete="name"></label>
      <label>Number of guests<input name="guests" type="number" min="1" max="10" value="1" required></label>
      <fieldset>
        <legend>Attending?</legend>
        <label class="radio"><input type="radio" name="attend" value="Joyfully accepts" checked> Yes, we'll be there</label>
        <label class="radio"><input type="radio" name="attend" value="Regretfully declines"> Sorry, we can't make it</label>
      </fieldset>
      <label>Message for the couple (optional)<textarea name="msg" rows="3"></textarea></label>
      <button class="btn" type="submit">Send RSVP on WhatsApp</button>
    </form>
  </section>

  <footer>
    <p id="hosts"></p>
    <button class="btn ghost" id="shareBtn">Share this invitation</button>
  </footer>
</main>

<audio id="bgm" loop preload="none"></audio>
<button class="music-btn" id="musicBtn" aria-label="Play or pause music" aria-pressed="false" hidden>&#9835;</button>

<script src="js/config.js"></script>
<script src="js/script.js"></script>
</body>
</html>
