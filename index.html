<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Invitation</title>
<meta name="description" content="You are invited to our wedding.">
<meta property="og:title" content="You're invited to our wedding">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&family=Noto+Serif+Devanagari:wght@400;600&family=Noto+Sans+Devanagari:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="locked">

<div class="gate" id="gate">
  <div class="door left"></div><div class="door right"></div>
  <div class="side l"><img src="images/wallphoto.jpg" alt=""></div><div class="side r"><img src="images/wallphoto.jpg" alt=""></div>
  <button class="open-btn" id="openBtn" aria-label="Open invitation">
    <span class="medal">
      <span class="orbit"></span>
      <span class="coin"><video id="medalVid" src="videos/invite.mp4" poster="images/medallion.jpg" autoplay muted loop playsinline preload="auto" aria-label="Shubham and Nilam, 02 12 2026"></video></span>
      <i class="sp" style="--x:6%;--y:18%;--d:0s"></i><i class="sp" style="--x:92%;--y:24%;--d:.7s"></i>
      <i class="sp" style="--x:14%;--y:84%;--d:1.4s"></i><i class="sp" style="--x:88%;--y:80%;--d:2.1s"></i>
      <i class="sp" style="--x:50%;--y:2%;--d:1s"></i><i class="sp" style="--x:50%;--y:98%;--d:1.8s"></i>
    </span>
    <span class="hint" data-i18n="tap"></span>
  </button>
</div>

<nav class="nav" id="nav" hidden>
  <a href="#countdownWrap" data-i18n="nDate"></a><a href="#story" data-i18n="nStory"></a><a href="#events" data-i18n="nEvents"></a>
  <a href="#photos" data-i18n="nPhotos"></a><a href="#venue" data-i18n="nVenue"></a>
  <button id="langBtn" type="button"></button>
</nav>

<main>
  <section class="hero">
    <div class="arch">
      <div class="hero-photo" id="heroPhoto" hidden></div>
      <p class="lead" id="tagline"></p>
      <h1><span id="bride"></span><span class="amp">&amp;</span><span id="groom"></span></h1>
      <p class="date" id="dateLabel"></p>
      <p class="venue" id="venueShort"></p>
    </div>
  </section>

  <section class="block" id="countdownWrap">
    <h2 data-i18n="cdTitle"></h2>
    <div class="countdown">
      <div><b id="cd-d">0</b><small data-i18n="d"></small></div>
      <div><b id="cd-h">0</b><small data-i18n="h"></small></div>
      <div><b id="cd-m">0</b><small data-i18n="m"></small></div>
      <div><b id="cd-s">0</b><small data-i18n="s"></small></div>
    </div>
    <button class="btn ghost" id="calBtn" data-i18n="cal"></button>
  </section>

  <section class="block alt" id="story">
    <h2 data-i18n="hStory"></h2>
    <div class="story" id="story-list"></div>
  </section>

  <section class="block" id="events">
    <h2 data-i18n="hEvents"></h2>
    <div class="events" id="event-list"></div>
  </section>

  <section class="block dark" id="photos">
    <h2 data-i18n="hPhotos"></h2>
    <p class="sub" data-i18n="pSub"></p>
    <div class="gallery" id="gallery"></div>
    <p class="note" data-i18n="bNote"></p>
  </section>

  <section class="block" id="venue">
    <h2 data-i18n="hVenue"></h2>
    <p id="venueFull" class="center-text"></p>
    <div class="map"><iframe id="mapFrame" title="Venue map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
    <a class="btn" id="mapBtn" target="_blank" rel="noopener" data-i18n="dir"></a>
    <p class="note" id="dress"></p>
  </section>

  <footer>
    <p id="hosts"></p>
    <button class="btn ghost" id="shareBtn" data-i18n="share"></button>
  </footer>
</main>

<div class="modal" id="modal" hidden><div class="mbox"><button id="mClose" aria-label="Close">&times;</button><h3 id="mTitle"></h3><p id="mText"></p></div></div>

<audio id="bgm" loop preload="none"></audio>
<button class="music-btn" id="musicBtn" aria-label="Play or pause music" aria-pressed="false" hidden>&#9835;</button>

<script src="js/config.js"></script>
<script src="js/script.js"></script>
</body>
</html>
